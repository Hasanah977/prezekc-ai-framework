
name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Framework Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python utilities
        run: python -m compileall -q tools tests

      - name: Validate framework
        run: python tools/validate_framework.py --strict

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  requirements:
    name: Requirements Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract requirements
        run: |
          python tools/extract_requirements.py \
            --prd examples/markdown/prd.md \
            --srs examples/markdown/srs.md \
            --rtm examples/markdown/rtm.md \
            --output build/ci-requirements

      - name: Validate extracted requirements
        run: |
          python tools/validate_requirements.py \
            --prd build/ci-requirements/prd.json \
            --srs build/ci-requirements/srs.json \
            --rtm build/ci-requirements/rtm.json \
            --strict
