
name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Framework Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python utilities
        run: python -m compileall -q tools tests

      - name: Validate framework structure
        run: python tools/validate_framework.py --strict

      - name: Execute unit tests
        run: python -m unittest discover -s tests -v

  requirements:
    name: Requirements Traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate example requirement manifests
        run: |
          python tools/validate_requirements.py \
            --prd examples/prd.json \
            --srs examples/srs.json \
            --rtm examples/rtm.json \
            --strict
